<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta
      name="description"
      content="سایت شخصی حسین نوری - توسعه‌دهنده فول‌استک"
    />
    <link rel="stylesheet" href="./node_modules/animate.css/animate.min.css" />
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="IMG_۲۰۲۵۱۰۱۵_۱۲۱۵۱۱.jpg" type="image/png" />
    <title>hoseinoori</title>
  </head>
  <body>
    <PortfolioHeader></PortfolioHeader>
    <main>
      <section id="home">
        <h1>سلام سلام</h1>
        <h3>خوش آمديد</h3>
        <p>من نوري هستم</p>
      </section>
      <section id="tamrin">
        <ol type="A" start="1">
          <li>كشف</li>
          <li>استخراج</li>
          <li>فراوري</li>
        </ol>
        <table>
          <thead>
            <tr>
              <th>name</th>
              <th>job</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>hoseinoori</td>
              <td>CE</td>
            </tr>
          </tbody>
          <tfoot>
            <tr>
              <td colspan="2">این یک جدول است</td>
            </tr>
          </tfoot>
        </table>
        <form>
          <label for="username">نام كاربري:</label>
          <input
            type="text"
            id="username"
            placeholder="نام كاربري خود را وارد كنيد..."
          />
          <br />
          <label for="pas">رمزعبور:</label>
          <input
            type="password"
            id="pas"
            placeholder="رمزعبور خود را وارد كنيد..."
          />
          <br />
          <button id="info" type="button">ثبت اطلاعات</button>
          <p id="p_button"></p>
        </form>
        <div id="form-tabel">
          <div class="list-work">
            <form>
              <label for="work">فعالیت:</label>
              <input
                type="text"
                id="work"
                placeholder="فعالیت خود را وارد کنید"
              />
              <button type="button" id="B-work">اضافه کردن</button>
            </form>
          </div>
        </div>
        <article class="but">
          <a
            href="https://www.linkedin.com/in/hoseinoori"
            target="_blank"
            rel="noopener"
            class="my-link"
            >linkedin</a
          >
        </article>
      </section>
    </main>
    <footer>
      <p>© 2026 تمام حقوق محفوظ است.</p>
    </footer>
    <script src="script.js"></script>
  </body>
</html>
